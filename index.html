<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ron Erroll | UI/UX and Graphic Design Portfolio</title>
    
    <!-- Scripts for React, Babel, Tailwind, Lucide, and Framer Motion -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #e2e8f0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .selection-indigo::selection {
            background-color: #6366f1;
            color: white;
        }

        @keyframes marquee {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }
        
        .animate-marquee {
            display: flex;
            width: fit-content;
            animation: marquee 40s linear infinite;
        }
        
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="selection-indigo">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence, useMotionValue, useSpring, useTransform } = Motion;

        // --- Data Definitions ---

        const PROJECTS = [
            {
                id: 1,
                title: "ERP System Tech Upgrade",
                category: "UI/UX",
                image: "https://drive.google.com/thumbnail?id=1kKjkLAJ_6GEiC7vN3ePErAjFaHUW82g4&sz=w1200",
                description: "Mobile-first UI/UX redesign for Cebu Air's ERP system on Sharepoint Online.",
                tags: ["Figma", "Research", "Prototyping"],
                caseStudy: {
                    challenge: "The legacy ERP system version 3 was reaching end-of-life, desktop-only, and caused significant delays in field reporting. Workers needed precision data management on the go.",
                    solution: "Developed a mobile-first design language prioritizing high-frequency tasks. Used a card-based layout and optimized data entry fields to simplify complex data sets.",
                    results: "40% faster reporting speed, 95% user satisfaction rate, and a significant reduction in required training time for new version onboarding."
                }
            },
            {
                id: 2,
                title: "Nectar Shopping App",
                category: "Mobile App",
                image: "https://drive.google.com/thumbnail?id=1iFnCqFm5S7fkXgJcQmiMPB_9sdpvh0dx&sz=w1200", // Updated to your uploaded high-fidelity image
                description: "Frictionless grocery shopping experience for a UK-based startup.",
                tags: ["Branding", "Accessibility", "Mobile UI"],
                caseStudy: {
                    challenge: "In a crowded market, Nectar needed to prioritize accessibility for elderly users who found traditional grocery apps visually cluttered and complex.",
                    solution: "Implemented high-contrast visuals, larger touch targets, and a simplified 'one-tap' checkout process. Integrated simplified navigation patterns.",
                    results: "Increased retention rates by 25% and successfully carved a niche in the accessible grocery delivery segment."
                }
            },
            {
                id: 3,
                title: "JK Energies Web",
                category: "Web Design",
                image: "https://drive.google.com/thumbnail?id=1_TgRCijTcJGRstuHbBoEFEaVSvilRUya&sz=w1800",
                description: "Modernized digital presence for energy solutions provider.",
                tags: ["Development", "Interaction", "Responsive"],
                caseStudy: {
                    challenge: "The existing website was non-responsive and didn't reflect the high-tech innovative nature of the company's energy solutions, leading to low lead generation.",
                    solution: "Created a tech-forward visual overhaul using a dark-mode aesthetic with interactive elements. Built with sub-second performance in mind.",
                    results: "200% increase in lead inquiries and full compatibility across all mobile and desktop platforms."
                }
            },
            {
                id: 4,
                title: "Theo Marvee Ads",
                category: "Graphic Design",
                image: "https://drive.google.com/thumbnail?id=13eIBYC_ymdmmqTeicZotekiJDM0zFkbu&sz=w1800",
                description: "Premium digital and print ad campaigns for UK cosmetic brand.",
                tags: ["Visual ID", "Branding", "Print"],
                caseStudy: {
                    challenge: "Theo Marvee lacked visual consistency across digital and print mediums, leading to a fragmented luxury perception in the competitive UK market.",
                    solution: "Designed a comprehensive brand guideline including premium image placements, a specific palette, and typography that resonates with high-end cosmetics.",
                    results: "Unified brand presence across 5 countries and a significant lift in digital campaign engagement."
                }
            },
            {
                id: 5,
                title: "Kpop Magazine Content Collaborator",
                category: "Fashion Magazine",
                image: "https://drive.google.com/thumbnail?id=10wjOAnetkoJ_GjiHcTVdLXW1EPLNqmCu&sz=w1800",
                description: "Fashion Magazine digital and print ad design collaborator for NewJeans member.",
                tags: ["Magazine", "Branding", "Print"],
                caseStudy: {
                    challenge: "At the peak of NewJeans member Hanni's career in 2024, Marie Claire wanted to feature her as cover artist of their magazine issue.",
                    solution: "I have collaborated in magazine drafting and editorial works despite the smaller discography of the kpop group, the magazine wanted to reach more impact by featuring NewJeans.",
                    results: "The magazine feature helps the kpop group reach more milestones towards the rest of the year."
                }
            },
            {
                id: 6,
                title: "Milkshake Company Freelance Designer",
                category: "Branding, Digital Marketing",
                image: "https://drive.google.com/thumbnail?id=1fEmc6Q6emKjRd_XKH3c8T5suXzssr1bt&sz=w1800",
                description: "Infographics designer for milkshake company digital marketing strategy.",
                tags: ["Digital Marketing", "Branding", "Ads"],
                caseStudy: {
                    challenge: "The company wanted to reach more mango milkshare lovers with their new digital campaign plan.",
                    solution: "Created eyecatching infographics and social media ads to help them on boosting the ROAS (reach on ads spent).",
                    results: "Milkshake branding became more popular and gathers more clients and franchisee."
                }
            }
        ];

        const EXPERIENCE = [
            {
                role: "UI/UX Designer",
                company: "Ascendion",
                period: "2024 - Present",
                desc: "Focusing on large-scale digital product transformations and user-centric design systems."
            },
            {
                role: "Graphic & UI Designer / Dev",
                company: "JK Energies Technology Inc.",
                period: "2016 - 2024",
                desc: "Led digital modernization for high-tech energy sector clients."
            },
            {
                role: "IT Staff / Designer",
                company: "Cimech Systems",
                period: "2015 - 2016",
                desc: "Balanced IT infrastructure management with creative brand asset development."
            },
            {
                role: "Freelance UX Designer / Graphic Designer",
                company: "Various companies",
                period: "2017 - Present",
                desc: "Helping clients reach their brand goals."
            }
        ];

        const SKILLS = {
            "UI/UX": ["User Research", "Wireframing", "Prototyping", "Design Systems", "Accessibility"],
            "Graphic Design": ["Visual Identity", "Typography", "Print Design", "Color Theory"],
            "Tools": ["Figma", "Adobe Suite", "HTML/CSS", "JavaScript", "React"]
        };

        // --- Helper Components ---

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const CaseStudyModal = ({ project, isOpen, onClose }) => {
            if (!isOpen || !project) return null;

            return (
                <motion.div 
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    className="fixed inset-0 z-[60] bg-slate-950 overflow-y-auto px-6 py-12 md:p-12 lg:p-24"
                >
                    <div className="max-w-5xl mx-auto">
                        <button 
                            onClick={onClose}
                            className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors mb-12 group"
                        >
                            <Icon name="arrow-left" size={20} className="group-hover:-translate-x-1 transition-transform" />
                            Back to Work
                        </button>

                        <div className="grid lg:grid-cols-2 gap-12 mb-20">
                            <div>
                                <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-4 block">
                                    {project.category} Case Study
                                </span>
                                <h1 className="text-4xl md:text-6xl font-bold text-white mb-6 leading-tight">
                                    {project.title}
                                </h1>
                                <p className="text-xl text-slate-400 leading-relaxed mb-8 font-light">
                                    {project.description}
                                </p>
                                <div className="flex flex-wrap gap-2">
                                    {project.tags.map(tag => (
                                        <span key={tag} className="px-3 py-1 bg-white/5 rounded-full text-xs text-slate-300 font-medium border border-white/10">
                                            {tag}
                                        </span>
                                    ))}
                                </div>
                            </div>
                            <div className="rounded-[2.5rem] overflow-hidden border border-white/10 shadow-2xl relative aspect-square bg-slate-900">
                                <img src={project.image} alt={project.title} className="w-full h-full object-cover" />
                                <div className="absolute inset-0 bg-indigo-500/10 mix-blend-multiply"></div>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-3 gap-8 mb-12">
                            <div className="p-8 bg-slate-900 rounded-[2rem] border border-white/5">
                                <div className="w-12 h-12 bg-indigo-500/10 rounded-2xl flex items-center justify-center text-indigo-400 mb-6">
                                    <Icon name="target" size={24} />
                                </div>
                                <h3 className="text-xl font-bold text-white mb-4">The Challenge</h3>
                                <p className="text-slate-400 leading-relaxed text-sm font-light">{project.caseStudy.challenge}</p>
                            </div>
                            <div className="p-8 bg-slate-900 rounded-[2rem] border border-white/5">
                                <div className="w-12 h-12 bg-purple-500/10 rounded-2xl flex items-center justify-center text-purple-400 mb-6">
                                    <Icon name="lightbulb" size={24} />
                                </div>
                                <h3 className="text-xl font-bold text-white mb-4">The Solution</h3>
                                <p className="text-slate-400 leading-relaxed text-sm font-light">{project.caseStudy.solution}</p>
                            </div>
                            <div className="p-8 bg-indigo-600 rounded-[2rem] shadow-xl shadow-indigo-600/10">
                                <div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white mb-6">
                                    <Icon name="trophy" size={24} />
                                </div>
                                <h3 className="text-xl font-bold text-white mb-4">Key Results</h3>
                                <p className="text-indigo-50 leading-relaxed text-sm font-medium">{project.caseStudy.results}</p>
                            </div>
                        </div>

                        <div className="mt-20 pt-20 border-t border-white/10 text-center">
                            <h2 className="text-2xl font-bold text-white mb-6">Ready to collaborate?</h2>
                            <button 
                                onClick={onClose}
                                className="px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl transition-all shadow-xl shadow-indigo-600/20"
                            >
                                Start a Conversation
                            </button>
                        </div>
                    </div>
                </motion.div>
            );
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'Work', href: '#work' },
                { name: 'Experience', href: '#experience' },
                { name: 'Skills', href: '#skills' },
                { name: 'Contact', href: '#contact' }
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-slate-950/80 backdrop-blur-md py-4 border-b border-white/10' : 'bg-transparent py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <a href="#" className="text-2xl font-bold tracking-tighter text-white">
                            RON<span className="text-indigo-500">.</span>DESIGNS
                        </a>

                        <div className="hidden md:flex gap-8">
                            {navLinks.map((link) => (
                                <a key={link.name} href={link.href} className="text-sm font-bold text-slate-300 hover:text-white transition-colors uppercase tracking-widest">
                                    {link.name}
                                </a>
                            ))}
                        </div>

                        <button className="md:hidden text-white" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                            <Icon name={mobileMenuOpen ? "x" : "menu"} size={24} />
                        </button>
                    </div>

                    <AnimatePresence>
                        {mobileMenuOpen && (
                            <motion.div 
                                initial={{ opacity: 0, height: 0 }}
                                animate={{ opacity: 1, height: 'auto' }}
                                exit={{ opacity: 0, height: 0 }}
                                className="absolute top-full left-0 w-full bg-slate-900 border-b border-white/10 flex flex-col p-6 gap-6 md:hidden overflow-hidden"
                            >
                                {navLinks.map((link) => (
                                    <a key={link.name} href={link.href} onClick={() => setMobileMenuOpen(false)} className="text-xl font-bold text-slate-300">
                                        {link.name}
                                    </a>
                                ))}
                            </motion.div>
                        )}
                    </AnimatePresence>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-center pt-20 overflow-hidden bg-slate-950">
                <div className="absolute top-1/4 -left-20 w-96 h-96 bg-indigo-600/20 rounded-full blur-[128px]" />
                <div className="absolute bottom-1/4 -right-20 w-96 h-96 bg-purple-600/20 rounded-full blur-[128px]" />

                <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
                    <motion.div initial={{ opacity: 0, x: -50 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: 0.8 }}>
                        <span className="inline-block py-1 px-3 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold uppercase tracking-widest mb-6">
                            Available for New Projects
                        </span>
                        <h1 className="text-5xl lg:text-7xl font-extrabold text-white leading-[1.1] mb-6 tracking-tighter">
                            Architecting <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Digital Mastery</span>
                        </h1>
                        <p className="text-xl text-slate-400 mb-8 max-w-lg leading-relaxed font-light">
                            Hi, I’m Ron Erroll! I blend strategy and visual excellence to build accessible digital products. 
                        </p>
                        <div className="flex flex-wrap gap-4">
                            <a href="#work" className="px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl transition-all flex items-center gap-2 group shadow-xl shadow-indigo-600/20">
                                View My Work
                                <Icon name="chevron-right" size={18} className="group-hover:translate-x-1 transition-transform" />
                            </a>
                            <a href="#contact" className="px-8 py-4 bg-white/5 hover:bg-white/10 text-white font-bold rounded-2xl border border-white/10 transition-all">
                                Get in Touch
                            </a>
                        </div>
                    </motion.div>

                    <motion.div initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 1, delay: 0.2 }} className="relative hidden md:block">
                        <div className="relative z-10 rounded-[2.5rem] overflow-hidden border border-white/10 shadow-2xl aspect-square bg-slate-900">
                            <img 
                                src="Corporate - RECY.jpg"
                                alt="Ron Erroll" 
                                className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-1000"
                                onError={(e) => { e.target.onerror = null; e.target.src = "https://drive.google.com/thumbnail?id=1_M6Xg-VVduBJ2C3I9rUawdo5gqKpoh55&sz=w800"; }}
                            />
                        </div>
                        <div className="absolute -bottom-6 -right-6 bg-slate-900/90 backdrop-blur-xl border border-white/10 p-6 rounded-3xl z-20 shadow-2xl">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-indigo-500/20 rounded-2xl text-indigo-400">
                                    <Icon name="check-circle-2" size={28} />
                                </div>
                                <div>
                                    <p className="text-3xl font-extrabold text-white">8+</p>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Years Depth</p>
                                </div>
                            </div>
                        </div>
                    </motion.div>
                </div>
            </section>
        );

    
                <section id="work" className="py-24 bg-slate-950">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                            <div>
                                <h2 className="text-4xl font-extrabold text-white mb-4">Featured Work</h2>
                                <p className="text-slate-400 max-w-md font-light">Crafting solutions where logic meets visual storytelling.</p>
                            </div>
                            
                        </div>

                        <motion.div layout className="grid md:grid-cols-2 gap-10">
                            <AnimatePresence mode='popLayout'>
                                {filteredProjects.map((project) => (
                                    <motion.div
                                        key={project.id}
                                        layout
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        exit={{ opacity: 0, scale: 0.95 }}
                                        className="group relative bg-slate-900 rounded-[2.5rem] overflow-hidden border border-white/5 cursor-pointer"
                                        onClick={() => onSelectProject(project)}
                                    >
                                        <div className="aspect-[16/10] overflow-hidden relative">
                                            <img src={project.image} alt={project.title} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" />
                                            <div className="absolute inset-0 bg-indigo-900/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                                                <span className="px-8 py-3 bg-white text-slate-900 rounded-full text-sm font-bold flex items-center gap-2 transform translate-y-4 group-hover:translate-y-0 transition-transform">
                                                    Deep Dive Study <Icon name="external-link" size={16} />
                                                </span>
                                            </div>
                                        </div>
                                        
                                        <div className="p-10">
                                            <span className="text-[10px] font-extrabold text-indigo-400 uppercase tracking-[0.2em] mb-3 block">{project.category}</span>
                                            <h3 className="text-2xl font-extrabold text-white mb-3 group-hover:text-indigo-400 transition-colors">{project.title}</h3>
                                            <p className="text-slate-400 text-lg mb-8 line-clamp-2 font-light">{project.description}</p>
                                            <div className="flex flex-wrap gap-2">
                                                {project.tags.map(tag => (
                                                    <span key={tag} className="px-4 py-1.5 bg-white/5 border border-white/10 rounded-full text-[10px] font-bold text-slate-300 uppercase tracking-widest">
                                                        {tag}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </motion.div>
                                ))}
                            </AnimatePresence>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Experience = () => (
            <section id="experience" className="py-24 bg-slate-900/50 border-y border-white/5">
                <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-20">
                    <div>
                        <h2 className="text-4xl font-extrabold text-white mb-12">Experience</h2>
                        <div className="space-y-12">
                            {EXPERIENCE.map((exp, idx) => (
                                <div key={idx} className="relative pl-8 border-l-2 border-indigo-500/20 group">
                                    <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-indigo-500 border-4 border-slate-950 group-hover:scale-150 transition-transform" />
                                    <p className="text-indigo-400 text-xs font-bold uppercase tracking-widest mb-2">{exp.period}</p>
                                    <h3 className="text-2xl font-bold text-white mb-1">{exp.role}</h3>
                                    <p className="text-slate-400 font-medium mb-3">{exp.company}</p>
                                    <p className="text-slate-500 text-lg leading-relaxed font-light">{exp.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <div id="skills">
                        <h2 className="text-4xl font-extrabold text-white mb-12">Toolkit</h2>
                        <div className="space-y-10">
                            {Object.entries(SKILLS).map(([title, skills]) => (
                                <div key={title}>
                                    <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-6 flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full bg-indigo-500" />
                                        {title}
                                    </h3>
                                    <div className="flex flex-wrap gap-3">
                                        {skills.map(skill => (
                                            <span key={skill} className="px-6 py-3 bg-white/5 border border-white/10 rounded-2xl text-slate-300 text-sm font-bold hover:bg-indigo-500/10 hover:border-indigo-500/30 transition-all">
                                                {skill}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const ContactSection = () => {
            const containerRef = useRef(null);
            const mouseX = useMotionValue(0);
            const mouseY = useMotionValue(0);
            const smoothX = useSpring(mouseX, { damping: 25, stiffness: 150 });
            const smoothY = useSpring(mouseY, { damping: 25, stiffness: 150 });

            const handleMouseMove = (e) => {
                if (!containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                mouseX.set(e.clientX - rect.left);
                mouseY.set(e.clientY - rect.top);
            };

            const contactDetails = [
                { id: 'email', icon: "mail", label: 'Email', value: 'sevenspeed.official@gmail.com', link: 'mailto:sevenspeed.official@gmail.com', color: 'from-indigo-400 to-blue-500' },
                { id: 'phone', icon: "message-circle", label: 'Viber / Mobile', value: '+63 967 255 2702', link: 'tel:+639672552702', color: 'from-purple-500 to-indigo-500' },
                { id: 'loc', icon: "globe", label: 'Location', value: 'Laguna, Philippines', link: '#', color: 'from-blue-600 to-cyan-500' }
            ];

            return (
                <section id="contact" ref={containerRef} onMouseMove={handleMouseMove} className="py-32 bg-slate-950 relative overflow-hidden group/contact">
                    <motion.div 
                        className="absolute inset-0 pointer-events-none opacity-0 group-hover/contact:opacity-100 transition-opacity duration-700"
                        style={{ background: useTransform([smoothX, smoothY], ([x, y]) => `radial-gradient(800px circle at ${x}px ${y}px, rgba(99, 102, 241, 0.08), transparent)`) }}
                    />
                    
                    <div className="max-w-7xl mx-auto px-6 relative z-10 text-center">
                        <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }}>
                            <h2 className="text-5xl md:text-8xl font-black text-white mb-8 tracking-tighter">
                                Let's <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Collaborate</span>.
                            </h2>
                            <p className="text-slate-400 max-w-2xl mx-auto text-xl mb-16 font-light">
                                Currently available for new digital challenges and creative partnerships.
                            </p>
                        </motion.div>

                        <div className="grid md:grid-cols-3 gap-8">
                            {contactDetails.map((detail, index) => (
                                <motion.a 
                                    key={detail.id} 
                                    href={detail.link} 
                                    initial={{ opacity: 0, y: 20 }} 
                                    whileInView={{ opacity: 1, y: 0 }} 
                                    viewport={{ once: true }} 
                                    transition={{ delay: index * 0.1 }}
                                    className="group/item relative block"
                                >
                                    <div className="h-full bg-slate-900/40 backdrop-blur-xl border border-white/10 p-10 rounded-[3rem] transition-all hover:bg-slate-900 hover:border-white/20 hover:-translate-y-2">
                                        <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${detail.color} p-[1px] mb-8 mx-auto group-hover/item:scale-110 transition-transform`}>
                                            <div className="w-full h-full bg-slate-950 rounded-[15px] flex items-center justify-center text-white">
                                                <Icon name={detail.icon} size={24} />
                                            </div>
                                        </div>
                                        <p className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-3">{detail.label}</p>
                                        <p className="text-white font-extrabold tracking-tight text-xl truncate">{detail.value}</p>
                                    </div>
                                </motion.a>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-12 bg-slate-950 border-t border-white/5">
                <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
                    <div className="text-xl font-bold tracking-tighter text-white">
                        RON<span className="text-indigo-500">.</span>DESIGNS
                    </div>
                    <p className="text-slate-500 text-xs font-bold uppercase tracking-widest">
                        © {new Date().getFullYear()} Ron Erroll. Built with passion & motion.
                    </p>
                </div>
            </footer>
        );

        const App = () => {
            const [selectedProject, setSelectedProject] = useState(null);

            useEffect(() => {
                document.body.style.overflow = selectedProject ? 'hidden' : 'auto';
            }, [selectedProject]);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-indigo-500 selection:text-white">
                    <Navbar />
                    <main>
                        <Hero />
                        <Portfolio onSelectProject={setSelectedProject} />
                        <Experience />
                        <ContactSection />
                    </main>
                    <Footer />

                    <AnimatePresence>
                        {selectedProject && (
                            <CaseStudyModal 
                                project={selectedProject} 
                                isOpen={!!selectedProject} 
                                onClose={() => setSelectedProject(null)} 
                            />
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
