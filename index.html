<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ron Erroll | Portfolio</title>
    
    <!-- Scripts for React, Babel (JSX), Tailwind, and Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        @keyframes marquee {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }
        
        .animate-marquee {
            display: flex;
            width: fit-content;
            animation: marquee 30s linear infinite;
        }
        
        .animate-marquee:hover {
            animation-play-state: paused;
        }

        .selection-blue::selection {
            background-color: #dbeafe;
            color: #1e3a8a;
        }
    </style>
</head>
<body class="bg-white selection-blue">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon Helper for Lucide CDN
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('home');
            const [selectedProject, setSelectedProject] = useState(null);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'About', href: '#about' },
                { name: 'Projects', href: '#projects' },
                { name: 'Contact', href: '#contact' },
            ];

            const projects = [
                {
                    id: 1,
                    title: "ERP System Tech Upgrade",
                    category: "UX/UI Design",
                    description: "Created Mobile first UI/UX design for Sharepoint Online web-based ERP system for Cebu Air Inc. Focus on field productivity and real-time data sync.",
                    tags: ["Figma", "User Research", "Prototyping"],
                    image: "https://drive.google.com/thumbnail?id=1kKjkLAJ_6GEiC7vN3ePErAjFaHUW82g4&sz=w1200",
                    details: {
                        role: "UI/UX Designer",
                        timeline: "21 Months",
                        tools: ["Figma", "Sharepoint", "Adobe Suite"],
                        challenge: "The legacy ERP system version 3 was becoming unsupported, desktop-only, and caused significant delays in field reporting for workers.",
                        solution: "I developed a mobile-first design language that prioritized high-frequency tasks using a card-based layout and optimized entry fields.",
                        results: ["40% faster reporting", "95% user satisfaction rate", "Streamlined navigation architecture"]
                    }
                },
                {
                    id: 2,
                    title: "Nectar Online Shopping app",
                    category: "Mobile App Design",
                    description: "Collaborated with Nectar, a UK based company. Created a UX Design for their planned online grocery app designed specifically for ease of use.",
                    tags: ["Illustrator", "Branding", "Mobile App"],
                    image: "https://drive.google.com/thumbnail?id=1iFnCqFm5S7fkXgJcQmiMPB_9sdpvh0dx&sz=w1200",
                    details: {
                        role: "UX Designer",
                        timeline: "4 Months",
                        tools: ["Figma", "Miro", "Illustrator"],
                        challenge: "Creating a frictionless experience for elderly users in a crowded market where traditional apps were too complex.",
                        solution: "Implemented high-contrast visuals, larger touch targets, and a simplified 'one-tap' checkout process.",
                        results: ["25% increase in retention", "Top 10 Grocery App segments", "Seamless accessible UX"]
                    }
                },
                {
                    id: 3,
                    title: "Company Website Upgrade",
                    category: "Front End Design and Development",
                    description: "JK Energies Technology Inc. website design upgrade. Created a modern, high-performance UI and developed the responsive front-end.",
                    tags: ["Web Design", "UI Design", "Front-End Dev"],
                    image: "https://drive.google.com/thumbnail?id=1_TgRCijTcJGRstuHbBoEFEaVSvilRUya&sz=w1800",
                    details: {
                        role: "UI Designer & Developer",
                        timeline: "3 Months",
                        tools: ["HTML5", "Bootstrap", "Figma"],
                        challenge: "The existing website was non-responsive and failed to reflect the high-tech nature of the company's energy solutions.",
                        solution: "A complete visual overhaul using a dark-mode tech aesthetic with interactive SVG animations that explain energy flows.",
                        results: ["200% lead generation increase", "Sub-second load times", "Full device responsiveness"]
                    }
                },
                {
                    id: 4,
                    title: "Digital and Print ads",
                    category: "Graphic Design",
                    description: "Made digital and print ad design for Theo Marvee, a cosmetic company in UK, focusing on premium branding and visual storytelling.",
                    tags: ["Branding", "Visual Design", "Visual ID"],
                    image: "https://drive.google.com/thumbnail?id=13eIBYC_ymdmmqTeicZotekiJDM0zFkbu&sz=w1800",
                    details: {
                        role: "Lead Graphic Designer",
                        timeline: "1 Month",
                        tools: ["Adobe Illustrator", "Photoshop", "InDesign"],
                        challenge: "The brand lacked consistency across digital and print mediums, leading to confused customer perceptions.",
                        solution: "Designed a comprehensive brand guideline including versatile image placements and a specific premium color palette.",
                        results: ["Unified brand presence", "Stakeholder approval", "Launched in 5 countries"]
                    }
                }
            ];

            const skills = [
                { name: "UI Design", icon: "palette" },
                { name: "UX Research", icon: "user" },
                { name: "Prototyping", icon: "layers" },
                { name: "Visual Design", icon: "code" },
                { name: "Mobile Strategy", icon: "smartphone" },
                { name: "Graphic Design", icon: "palette" },
                { name: "Web Development", icon: "monitor" },
                { name: "Wireframing", icon: "layout" },
            ];

            const duplicatedSkills = [...skills, ...skills, ...skills];

            const handleOpenCaseStudy = (project) => {
                setSelectedProject(project);
                setCurrentView('case-study');
                window.scrollTo({ top: 0, behavior: 'instant' });
            };

            const handleBackToHome = () => {
                setCurrentView('home');
                setSelectedProject(null);
                window.scrollTo({ top: 0, behavior: 'instant' });
            };

            const scrollToSection = (e, id) => {
                e.preventDefault();
                if (currentView !== 'home') {
                    setCurrentView('home');
                    setTimeout(() => {
                        const element = document.getElementById(id.replace('#', ''));
                        if (element) element.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                } else {
                    const element = document.getElementById(id.replace('#', ''));
                    if (element) {
                        const offset = 80;
                        const bodyRect = document.body.getBoundingClientRect().top;
                        const elementRect = element.getBoundingClientRect().top;
                        const elementPosition = elementRect - bodyRect;
                        const offsetPosition = elementPosition - offset;
                        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                    }
                }
                setIsMenuOpen(false);
            };

            const HomeView = () => (
                <React.Fragment>
                    <section className="pt-32 pb-20 md:pt-48 md:pb-32 px-6">
                        <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                            <div>
                                <span className="inline-block px-4 py-1.5 rounded-full bg-blue-50 text-blue-600 text-sm font-semibold mb-6">
                                    Available for new projects
                                </span>
                                <h1 className="text-5xl md:text-7xl font-bold leading-[1.1] mb-6">
                                    Designing <span className="text-blue-600">meaningful</span> digital experiences.
                                </h1>
                                <p className="text-lg md:text-xl text-slate-600 mb-8 max-w-lg leading-relaxed">
                                    Hi, I’m Ron Erroll! I specialize in designing accessible, high-impact digital products. I blend corporate strategy with user-centric design to help retail brands and tech companies scale their presence.
                                </p>
                                <div className="flex flex-wrap gap-4">
                                    <button onClick={(e) => scrollToSection(e, '#projects')} className="px-8 py-4 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-all flex items-center gap-2">
                                        View My Work <Icon name="chevron-right" size={18} />
                                    </button>
                                    <div className="flex items-center gap-4 ml-2">
                                        <a href="#" className="p-3 text-slate-400 hover:text-blue-600 transition-colors"><Icon name="linkedin" /></a>
                                        <a href="#" className="p-3 text-slate-400 hover:text-blue-600 transition-colors"><Icon name="facebook" /></a>
                                    </div>
                                </div>
                            </div>
                            <div className="relative hidden md:block">
                                <div className="aspect-square bg-blue-50 rounded-3xl overflow-hidden relative">
                                    <img src="https://drive.google.com/thumbnail?id=1_M6Xg-VVduBJ2C3I9rUawdo5gqKpoh55" alt="Ron Erroll" className="w-full h-full object-cover transition-all duration-700" onError={(e) => { e.target.onerror = null; e.target.src = "https://drive.google.com/thumbnail?id=1_M6Xg-VVduBJ2C3I9rUawdo5gqKpoh55?auto=format&fit=crop&q=80&w=800"; }} />
                                    <div className="absolute inset-0 bg-blue-600/5 mix-blend-multiply"></div>
                                </div>
                                <div className="absolute -bottom-6 -right-6 w-32 h-32 bg-blue-600 rounded-2xl -z-10 shadow-xl shadow-blue-200"></div>
                            </div>
                        </div>
                    </section>

                    <section className="py-12 bg-slate-50 border-y border-slate-100 overflow-hidden">
                        <div className="animate-marquee flex gap-12 items-center py-4">
                            {duplicatedSkills.map((skill, idx) => (
                                <div key={idx} className="flex items-center gap-4 px-8 py-4 bg-white rounded-2xl shadow-sm border border-slate-100 whitespace-nowrap group hover:border-blue-300 transition-colors">
                                    <div className="text-slate-400 group-hover:text-blue-600"><Icon name={skill.icon} /></div>
                                    <span className="text-sm font-bold text-slate-600 group-hover:text-blue-600">{skill.name}</span>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section id="projects" className="py-24 px-6 bg-slate-50">
                        <div className="max-w-6xl mx-auto">
                            <h2 className="text-4xl font-bold mb-12">Featured Projects</h2>
                            <div className="grid md:grid-cols-2 gap-10">
                                {projects.map((project) => (
                                    <div key={project.id} className="group bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-sm hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 flex flex-col">
                                        <div className="aspect-[16/10] relative overflow-hidden bg-slate-100">
                                            <img src={project.image} alt={project.title} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" />
                                            <div className="absolute inset-0 bg-blue-900/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                <button onClick={() => handleOpenCaseStudy(project)} className="px-8 py-3 bg-white text-blue-900 rounded-full font-bold transform translate-y-4 group-hover:translate-y-0 transition-all shadow-xl">
                                                    View Full Case Study
                                                </button>
                                            </div>
                                        </div>
                                        <div className="p-10 flex flex-col flex-grow">
                                            <span className="text-xs font-bold uppercase tracking-widest text-blue-600 mb-3 block">{project.category}</span>
                                            <h3 className="text-2xl font-bold mb-4 group-hover:text-blue-600 transition-colors leading-tight">{project.title}</h3>
                                            <p className="text-slate-600 mb-8 leading-relaxed text-lg font-light">{project.description}</p>
                                            <div className="mt-auto flex flex-wrap gap-2">
                                                {project.tags.map(tag => (
                                                    <span key={tag} className="text-xs font-semibold px-4 py-1.5 bg-slate-50 border border-slate-100 rounded-full text-slate-500">{tag}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="about" className="py-24 px-6">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex flex-col md:flex-row gap-16 items-start">
                                <div className="md:w-1/3">
                                    <h2 className="text-3xl font-bold mb-4">About Me</h2>
                                    <div className="w-12 h-1 bg-blue-600 rounded-full"></div>
                                </div>
                                <div className="md:w-2/3">
                                    <p className="text-xl leading-relaxed text-slate-700 mb-6 font-light">
                                        With over 8 years of relevant experience in the design industry, I focus on the intersection of human behavior and visual storytelling.
                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-8 mt-12">
                                        <div className="space-y-4">
                                            <h3 className="font-bold text-lg text-blue-600">Experience</h3>
                                            <div className="border-l-2 border-blue-100 pl-4 space-y-6">
                                                <div><p className="font-bold">UI/UX Designer</p><p className="text-sm text-slate-500">Ascendion • 2024 - Present</p></div>
                                                <div><p className="font-bold">Graphic and UI Designer</p><p className="text-sm text-slate-500">JK Energies • 2016 - 2024</p></div>
                                                <div><p className="font-bold">IT Staff</p><p className="text-sm text-slate-500">Cimech Systems • 2015 - 2016</p></div>
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            <h3 className="font-bold text-lg text-blue-600">Education</h3>
                                            <div className="border-l-2 border-blue-100 pl-4 space-y-6">
                                                <div><p className="font-bold">BS in IT</p><p className="text-sm text-slate-500">Laguna State Polytechnic University</p></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </React.Fragment>
            );

            const CaseStudyView = ({ project }) => (
                <div className="pt-24 min-h-screen bg-slate-50/50">
                    <div className="max-w-6xl mx-auto px-6 mb-12">
                        <button onClick={handleBackToHome} className="flex items-center gap-2 text-slate-500 hover:text-blue-600 transition-colors font-semibold mb-8 group">
                            <Icon name="chevron-left" className="group-hover:-translate-x-1 transition-transform" /> Back to Home
                        </button>
                        <div className="grid lg:grid-cols-2 gap-12 items-end mb-16">
                            <div>
                                <span className="text-blue-600 font-bold uppercase tracking-widest text-sm mb-4 block">{project.category}</span>
                                <h1 className="text-4xl md:text-6xl font-bold leading-tight">{project.title}</h1>
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-8 py-8 border-t lg:border-t-0 lg:border-l border-slate-200 lg:pl-12">
                                <div><p className="text-xs text-slate-400 font-bold mb-1 tracking-tight">ROLE</p><p className="font-semibold text-sm">{project.details.role}</p></div>
                                <div><p className="text-xs text-slate-400 font-bold mb-1 tracking-tight">TIMELINE</p><p className="font-semibold text-sm">{project.details.timeline}</p></div>
                                <div><p className="text-xs text-slate-400 font-bold mb-1 tracking-tight">TOOLS</p><p className="font-semibold text-sm">{project.details.tools.join(", ")}</p></div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-6 mb-24">
                        <div className="relative group">
                            <div className="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-[2.5rem] blur opacity-10"></div>
                            <div className="relative rounded-[2rem] overflow-hidden shadow-2xl bg-white aspect-video md:aspect-[21/9] border border-slate-200">
                                <img src={project.image} alt={project.title} className="w-full h-full object-cover object-top" />
                            </div>
                        </div>
                    </div>

                    <div className="max-w-3xl mx-auto px-6 pb-32 space-y-24 bg-white md:-mt-12 md:relative md:z-10 md:rounded-t-[3rem] md:pt-24 md:shadow-lg">
                        <section>
                            <div className="flex items-center gap-3 text-blue-600 mb-6">
                                <div className="p-2 bg-blue-50 rounded-lg"><Icon name="target" /></div>
                                <h2 className="text-2xl font-bold text-slate-900">The Challenge</h2>
                            </div>
                            <p className="text-xl text-slate-600 leading-relaxed font-light">{project.details.challenge}</p>
                        </section>

                        <section>
                            <div className="flex items-center gap-3 text-blue-600 mb-6">
                                <div className="p-2 bg-blue-50 rounded-lg"><Icon name="lightbulb" /></div>
                                <h2 className="text-2xl font-bold text-slate-900">The Solution</h2>
                            </div>
                            <p className="text-xl text-slate-600 leading-relaxed font-light">{project.details.solution}</p>
                        </section>

                        {/* KEY RESULTS SECTION */}
                        <section className="bg-slate-900 p-8 md:p-12 rounded-[2.5rem] text-white relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-64 h-64 bg-blue-600 rounded-full blur-[100px] opacity-20 -mr-32 -mt-32"></div>
                            <div className="relative z-10">
                                <div className="flex items-center gap-3 text-blue-400 mb-8">
                                    <Icon name="check-circle-2" />
                                    <h2 className="text-2xl font-bold text-white">Key Results</h2>
                                </div>
                                <div className="grid sm:grid-cols-3 gap-8">
                                    {project.details.results.map((result, i) => (
                                        <div key={i} className="space-y-2">
                                            <div className="w-8 h-1 bg-blue-500 rounded-full mb-4"></div>
                                            <p className="text-slate-300 font-medium leading-snug">{result}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        <div className="pt-12 flex justify-center">
                            <button onClick={handleBackToHome} className="px-8 py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-all shadow-xl hover:-translate-y-1">
                                Back to All Projects
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-white text-slate-900">
                    <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled || currentView === 'case-study' ? 'bg-white/90 backdrop-blur-md shadow-sm py-4' : 'bg-transparent py-6'}`}>
                        <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
                            <a href="#" onClick={handleBackToHome} className="text-2xl font-bold text-blue-600 tracking-tighter">Ron.DESIGNS</a>
                            <div className="hidden md:flex space-x-8 items-center">
                                {navLinks.map(link => (
                                    <a key={link.name} href={link.href} onClick={(e) => scrollToSection(e, link.href)} className="text-sm font-medium hover:text-blue-600 transition-colors">{link.name}</a>
                                ))}
                                <button onClick={(e) => scrollToSection(e, '#contact')} className="px-5 py-2.5 bg-blue-600 text-white rounded-full text-sm font-medium hover:bg-blue-700 shadow-lg">Hire Me</button>
                            </div>
                            <button className="md:hidden p-2" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                <Icon name={isMenuOpen ? "x" : "menu"} />
                            </button>
                        </div>
                        {isMenuOpen && (
                            <div className="md:hidden bg-white border-b p-6 flex flex-col space-y-4">
                                {navLinks.map(link => (
                                    <a key={link.name} href={link.href} onClick={(e) => scrollToSection(e, link.href)} className="text-lg font-medium">{link.name}</a>
                                ))}
                            </div>
                        )}
                    </nav>

                    {currentView === 'home' ? <HomeView /> : <CaseStudyView project={selectedProject} />}

                    <section id="contact" className="py-24 px-6 bg-blue-600 text-white relative overflow-hidden">
                        <div className="max-w-6xl mx-auto relative z-10 grid md:grid-cols-2 gap-16 items-center">
                            <div>
                                <h2 className="text-4xl md:text-5xl font-bold mb-6">Let's build something amazing together.</h2>
                                <p className="text-blue-100 text-lg mb-10 max-w-md">I'm always open to discussing new ideas and opportunities.</p>
                                <div className="space-y-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-white/10 backdrop-blur-sm rounded-2xl flex items-center justify-center"><Icon name="mail" /></div>
                                        <div><p className="text-sm text-blue-200">Email me at</p><p className="font-semibold text-lg">sevenspeed.official@gmail.com</p></div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-white/10 backdrop-blur-sm rounded-2xl flex items-center justify-center"><Icon name="message-circle" /></div>
                                        <div><p className="text-sm text-blue-200">Message via Viber</p><p className="font-semibold text-lg">+63 915 028 4819</p></div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-white/10 backdrop-blur-sm rounded-2xl flex items-center justify-center"><Icon name="briefcase" /></div>
                                        <div><p className="text-sm text-blue-200">Currently in</p><p className="font-semibold text-lg">Laguna, Philippines</p></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <footer className="py-12 px-6 border-t border-slate-100 text-center">
                        <p className="text-slate-400 text-sm">© 2024 Ron Erroll. Built with passion & pixels.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
